name: CodeQL

# Status: CONFIGURED BUT NOT YET VERIFIED — this repository has no GitHub
# remote yet (see the Foundation Gate 0 report). This workflow will start
# actually running once pushed. CodeQL is a static-analysis detection layer,
# not proof of security — see docs/SECURITY.md's defense-in-depth table for
# what it does and does not catch.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
