name: CI

# Gate order per docs/RELEASE_GATES.md: Lint -> Typecheck -> Unit -> Integration -> E2E -> Security Checks -> Build.
# Every job runs a real command; none is a placeholder that always succeeds.
# "Security Checks" covers both dependency-audit (this file) and CodeQL/Dependabot
# (the separate codeql.yml workflow) — not duplicated, two different layers.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    # Real MySQL 8.0+ service container — never SQLite (docs/DATABASE_RULES.md).
    # packages/db and apps/api declare creatorcore.testGates.integration = true
    # and connect to this service via the DATABASE_URL below.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: creatorcore_test
          MYSQL_USER: creatorcore
          MYSQL_PASSWORD: creatorcore_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # CI-only, disposable test credentials — never shared with staging/production
      # (docs/DEVELOPMENT.md's environment-separation rule).
      DATABASE_URL: mysql://creatorcore:creatorcore_test_password@127.0.0.1:3306/creatorcore_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    # NOT APPLICABLE until a workspace declares creatorcore.testGates.e2e = true
    # (see docs/TESTING.md) — i.e. until a dashboard/browser-facing app exists.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  build:
    needs: [integration-tests, e2e-tests, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  dependency-audit:
    runs-on: ubuntu-latest
    # Complements (does not replace) CodeQL/Dependabot in codeql.yml — this
    # catches known-vulnerable versions already in the lockfile at PR time.
    # Fails CI only on high/critical; lower-severity findings are visible in
    # the log but don't block (docs/RELEASE_GATES.md's gate-order principle).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
