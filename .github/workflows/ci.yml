name: CI

# Gate order per docs/RELEASE_GATES.md: Lint -> Typecheck -> Unit -> Integration -> E2E -> Build.
# Every job runs a real command; none is a placeholder that always succeeds.
# "Security Checks" in the documented gate order is handled by the separate
# codeql.yml workflow, not duplicated here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    # NOT APPLICABLE until a workspace declares creatorcore.testGates.integration = true
    # (see docs/TESTING.md). When that happens, this job should be extended
    # with a real MySQL 8.0+ service container — never SQLite — per
    # docs/DATABASE_RULES.md.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    # NOT APPLICABLE until a workspace declares creatorcore.testGates.e2e = true
    # (see docs/TESTING.md) — i.e. until a dashboard/browser-facing app exists.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  build:
    needs: [integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
